<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monge 3D model viewer</title>
<style>
:root {
  --bg: #121316;
  --card: #17181b;
  --raise: #222428;
  --line: rgba(255, 255, 255, .08);
  --text: #eceef1;
  --muted: #8e939c;
  --gold: #d4aa4e;
  --cta: #e9dfc8;
  --cta-ink: #1b1710;
  --stage-a: #1f2125;
  --stage-b: #111214;
  --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f3ef;
  --card: #ffffff;
  --raise: #f0eee9;
  --line: rgba(0, 0, 0, .09);
  --text: #17181b;
  --muted: #6b7079;
  --gold: #9a6f1c;
  --cta: #1d1e21;
  --cta-ink: #f4f1e8;
  --stage-a: #f6f5f1;
  --stage-b: #e2dfd7;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: transparent; color: var(--text); font: 13.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { padding: 2px; }
button, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon:hover { color: var(--text); background: var(--raise); }
.icon svg { width: 17px; height: 17px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

/* header: the mark, the word, the set's short name, two icons */
.head { display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; }
.brand svg { width: 24px; height: 24px; }
.brand b { font-weight: 500; font-size: 12.5px; letter-spacing: .32em; color: var(--muted); }
.sep { width: 1px; height: 18px; background: var(--line); }
.title { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the stage: most of the card */
.stage { position: relative; height: 430px; margin: 8px; border-radius: 12px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 42%, var(--stage-a), var(--stage-b) 80%); touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 24px; }
.poster.hidden { display: none; }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px; pointer-events: none; }
.label3d { position: absolute; transform: translate(-50%, 0); font-size: 13px; white-space: nowrap; pointer-events: none; color: var(--muted); transition: color .2s; }
.label3d.on { color: var(--text); }
.corner { position: absolute; display: flex; gap: 6px; }
.tl { left: 12px; top: 12px; }
.bl { left: 12px; bottom: 12px; }
.br { right: 12px; bottom: 12px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: color-mix(in srgb, var(--stage-b) 60%, transparent); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.seg button { padding: 5px 14px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.chip { padding: 6px 14px; border-radius: 10px; font-size: 13px; color: var(--text); background: color-mix(in srgb, var(--stage-b) 60%, transparent); border: 1px solid var(--line); backdrop-filter: blur(6px); }
.chip:hover { border-color: color-mix(in srgb, var(--text) 25%, transparent); }
.glass { border: 1px solid var(--line); background: color-mix(in srgb, var(--stage-b) 60%, transparent); backdrop-filter: blur(6px); }
.badge { position: absolute; left: 12px; top: 12px; font-size: 12px; padding: 3px 10px; border-radius: 8px; color: var(--text); background: color-mix(in srgb, var(--stage-b) 70%, transparent); }

/* menus (option, download in a set) */
.menu { position: absolute; z-index: 5; min-width: 180px; padding: 4px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0, 0, 0, .35); }
.menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; padding: 7px 10px; border-radius: 7px; text-align: left; font-size: 13px; }
.menu button:hover, .menu button[aria-checked="true"] { background: var(--raise); }
.menu button span { color: var(--muted); }

/* the bar: the part's key facts, «more», the format and «download» */
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 12px 12px 16px; flex-wrap: wrap; }
.facts { font-size: 14px; }
.facts b { font-weight: 600; }
.more { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; padding-left: 14px; border-left: 1px solid var(--line); }
.more:hover { color: var(--text); }
.more svg { width: 14px; height: 14px; transition: transform .2s; }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }
.spacer { flex: 1; }
.fmt { position: relative; }
.fmt select { appearance: none; padding: 8px 34px 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); font-size: 13.5px; letter-spacing: .02em; }
.fmt::after { content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
.cta { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 10px; background: var(--cta); color: var(--cta-ink); font-weight: 500; font-size: 13.5px; }
.cta:hover { filter: brightness(1.05); }
.cta svg { width: 14px; height: 14px; }
.cta:disabled { opacity: .5; cursor: default; }

/* details («more»): the facts table, the picture note */
.details { padding: 0 16px 14px; border-top: 1px solid var(--line); }
.data { margin-top: 8px; width: 100%; border-collapse: collapse; font-size: 13px; }
.data th, .data td { padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.data th { color: var(--muted); font-weight: 400; padding-right: 12px; }
.data td + td, .data th + td, .data thead th + th { padding-left: 14px; }
.data thead th { color: var(--text); font-weight: 500; }
.data tr:last-child th, .data tr:last-child td { border-bottom: 0; }
.data .na { color: var(--muted); }
.note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.foot { display: flex; gap: 16px; padding: 10px 4px 2px; font-size: 12.5px; }
.link { color: var(--muted); font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 12px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.link:hover { color: var(--text); }
.fallback { display: none; margin: 0 16px 10px; }
body.no3d .fallback { display: block; }
body.no3d .br, body.no3d .tl { display: none; }

/* full screen: the stage fills the window */
body.fs { padding: 0; height: 100vh; overflow: hidden; }
body.fs .card { height: 100vh; border-radius: 0; border: 0; display: flex; flex-direction: column; }
body.fs .stage { flex: 1; height: auto; }
body.fs .details { max-height: 40vh; overflow: auto; }
body.fs .foot { display: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <div class="brand"><svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#22252a"/><path fill="#d4aa4e" d="M272,732 L272,316 L296,292 L372,292 L512,500 L652,292 L728,292 L752,316 L752,732 L664,732 L664,452 L536,642 L488,642 L360,452 L360,732 Z"/></svg><b>MONGE</b></div>
    <span class="sep" aria-hidden="true"></span>
    <h1 class="title" id="title">Monge</h1>
    <button class="icon" id="info" type="button" title="Info"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v4.5M10 6.4v.1" stroke-linecap="round"/></svg></button>
    <button class="icon" id="full" type="button" title="Full screen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M3 12.5V17h4.5M17 12.5V17h-4.5"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <img class="poster" id="poster" alt="" hidden>
    <div class="badge" id="badge" hidden></div>
    <div class="corner tl"><div class="seg" id="layout" hidden></div></div>
    <div class="corner bl"><button class="chip" id="option" type="button" hidden></button></div>
    <div class="corner br"><button class="icon glass" id="reset" type="button" title="Reset view"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 10a6 6 0 1 0 1.8-4.3"/><path d="M4 3.5v3.3h3.3"/></svg></button></div>
    <div class="status" id="status">…</div>
  </div>
  <p class="note fallback" id="fallback"></p>
  <div class="bar">
    <div class="facts num" id="facts"></div>
    <button class="more" id="more" type="button" aria-expanded="false"><span id="moreLabel">More</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg></button>
    <span class="spacer"></span>
    <label class="fmt"><select id="format" aria-label="File format"></select></label>
    <button class="cta" id="download" type="button"><span id="downloadLabel">Download</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 2.5v9M4 8l4 4 4-4"/></svg></button>
  </div>
  <div class="details" id="details" hidden>
    <table class="data" id="data"></table>
    <p class="note" id="imgnote" hidden></p>
  </div>
</div>
<div class="foot"><button class="link" id="site" type="button">Open in Monge ↗</button><button class="link" id="license" type="button">Licence</button></div>
<!--APP_JS-->
</body>
</html>
