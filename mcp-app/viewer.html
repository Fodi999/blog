<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monge 3D model viewer</title>
<style>
:root {
  --bg: var(--color-background-primary, #17181b);
  --raise: var(--color-background-secondary, #202227);
  --line: color-mix(in srgb, var(--color-text-primary, #eef0f3) 11%, transparent);
  --text: var(--color-text-primary, #eceef1);
  --muted: var(--color-text-secondary, #969ba4);
  --accent: #d4aa4e;
  --stage-a: #24272d;
  --stage-b: #121316;
  --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: var(--color-background-primary, #ffffff);
  --raise: var(--color-background-secondary, #f4f4f2);
  --line: color-mix(in srgb, var(--color-text-primary, #17181b) 11%, transparent);
  --text: var(--color-text-primary, #17181b);
  --muted: var(--color-text-secondary, #6b7079);
  --accent: #9a6f1c;
  --stage-a: #f3f2ee;
  --stage-b: #dddad2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { padding: 14px 16px 16px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.title { margin: 0; font-size: 15.5px; font-weight: 600; letter-spacing: -.005em; line-height: 1.3; }
.sub { margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.mark { width: 18px; height: 18px; flex: none; opacity: .9; margin-top: 2px; }

/* segmented controls: models, options */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 8px; background: var(--raise); max-width: 100%; }
.seg button { padding: 4px 10px; border-radius: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .4; cursor: default; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.bar:empty, .bar:has(> [hidden]:only-child) { display: none; }

/* stage */
.stage { position: relative; height: 360px; margin-top: 10px; border-radius: 12px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 38%, var(--stage-a), var(--stage-b) 78%); touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 20px; }
.poster.hidden { display: none; }
.tools { position: absolute; right: 8px; top: 8px; display: flex; gap: 2px; padding: 2px; border-radius: 8px;
  background: color-mix(in srgb, var(--stage-b) 55%, transparent); backdrop-filter: blur(6px); }
.tool { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.tool:hover { color: var(--text); background: color-mix(in srgb, var(--text) 10%, transparent); }
.tool svg { width: 15px; height: 15px; }
.hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--muted); font-size: 11px; pointer-events: none; transition: opacity .6s; }
.hint.gone { opacity: 0; }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; text-align: center; padding: 20px; pointer-events: none; }
.label3d { position: absolute; transform: translate(-50%, -100%); font-size: 11px; padding: 1px 7px; border-radius: 5px; white-space: nowrap; pointer-events: none;
  color: var(--text); background: color-mix(in srgb, var(--stage-b) 70%, transparent); }
.badge { position: absolute; left: 10px; top: 10px; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; color: var(--text);
  background: color-mix(in srgb, var(--stage-b) 70%, transparent); }

/* data */
.data { margin-top: 12px; width: 100%; border-collapse: collapse; font-size: 13px; }
.data th, .data td { padding: 6px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.data th { color: var(--muted); font-weight: 400; width: 38%; padding-right: 12px; }
.data td + td, .data th + td, .data thead th + th { padding-left: 14px; }
.data thead th { color: var(--text); font-weight: 600; width: auto; }
.data tr:last-child th, .data tr:last-child td { border-bottom: 0; }
.data .na { color: var(--muted); }

.note { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.files { display: grid; gap: 6px; margin-top: 12px; }
.files .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.files .who { color: var(--muted); font-size: 12px; margin-right: 4px; }
.file { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 7px; background: var(--raise); font-size: 12.5px; }
.file:hover { box-shadow: 0 0 0 1px var(--line); }
.file b { font-weight: 600; letter-spacing: .02em; }
.file span { color: var(--muted); font-size: 11.5px; }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12px; }
.link { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.link:hover { color: var(--text); }
.fallback { display: none; }
body.no3d .fallback { display: block; }
body.no3d .tools, body.no3d .hint { display: none; }

/* full screen: the stage on the left, the data on the right */
body.fs { padding: 0; height: 100vh; overflow: hidden; }
body.fs .layout { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
body.fs .main { display: flex; flex-direction: column; padding: 14px 0 14px 16px; min-height: 0; }
body.fs .stage { flex: 1; height: auto; }
body.fs .side { overflow: auto; padding: 14px 16px; }
@media (max-width: 680px) { body.fs .layout { grid-template-columns: 1fr; grid-template-rows: 62vh 1fr; } body.fs .main { padding-right: 16px; } }
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="top">
      <div>
        <h1 class="title" id="title">Monge</h1>
        <div class="sub" id="sub"></div>
      </div>
      <svg class="mark" viewBox="0 0 1024 1024" aria-label="Monge CAD"><rect width="1024" height="1024" rx="220" fill="#1c1f24"/><path fill="#d4aa4e" d="M272,732 L272,316 L296,292 L372,292 L512,500 L652,292 L728,292 L752,316 L752,732 L664,732 L664,452 L536,642 L488,642 L360,452 L360,732 Z"/></svg>
    </div>
    <div class="bar"><div class="seg" id="models" hidden></div></div>
    <div class="stage" id="stage">
      <img class="poster" id="poster" alt="" hidden>
      <div class="badge" id="badge" hidden></div>
      <div class="tools">
        <button class="tool" id="reset" type="button" title="Reset view"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v3h3"/></svg></button>
        <button class="tool" id="full" type="button" title="Full screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
      </div>
      <div class="status" id="status">…</div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="side">
    <div class="bar"><div class="seg" id="options" hidden></div></div>
    <p class="note fallback" id="fallback"></p>
    <table class="data" id="data"></table>
    <p class="note" id="imgnote" hidden></p>
    <div class="files" id="files"></div>
    <div class="links" id="links"></div>
  </div>
</div>
<!--APP_JS-->
</body>
</html>
