<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const src = q.get('m'); const yaw = +(q.get('yaw') ?? -30), pitch = +(q.get('pitch') ?? 22);

panel(14,7,0xffffff,4.0,[0,6,1]); panel(2.5,8,0xffffff,3.0,[-6,1,2]); panel(2.5,8,0xbfe9ff,2.2,[6,1,-2]); panel(8,0.8,0xc4ff4d,0.08,[0,-2.5,-6]); panel(16,16,0x0e1218,1.0,[0,-5,0]);

const holder = new THREE.Group(); holder.add(model);
const box = new THREE.Box3().setFromObject(holder); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
const radius = size.length()/2; holder.position.sub(c); scene.add(holder);
const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
const gr = g.createRadialGradient(64,64,4,64,64,64); gr.addColorStop(0,'rgba(0,0,0,0.55)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0,0,128,128);

const fov = cam.fov*Math.PI/180; const dist = radius/Math.sin(fov/2)*(+(q.get('zoom') ?? 0.9));
const yr = yaw*Math.PI/180, pr = pitch*Math.PI/180;
cam.position.set(Math.sin(yr)*Math.cos(pr)*dist, Math.sin(pr)*dist, Math.cos(yr)*Math.cos(pr)*dist); cam.near = dist/100; cam.far = dist*10; cam.updateProjectionMatrix(); cam.lookAt(0,0,0);
renderer.render(scene, cam);
document.title = 'done';
</script></body></html>
